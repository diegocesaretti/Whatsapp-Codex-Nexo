name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify Codex OAuth dictation runtime
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('sol-plugin.json', 'utf8'));
          if (pkg.version !== manifest.version) throw new Error(`package/manifest version mismatch: ${pkg.version} != ${manifest.version}`);
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(pkg.version)) throw new Error(`invalid package version: ${pkg.version}`);
          const runtime = fs.readFileSync('dist/codex-appserver-audio.js', 'utf8');
          for (const required of ['backend-api/transcribe', 'getAuthStatus', 'includeToken']) {
            if (!runtime.includes(required)) throw new Error(`OAuth dictation runtime missing ${required}`);
          }
          for (const forbidden of ['localAudio', 'thread/start', 'turn/start']) {
            if (runtime.includes(forbidden)) throw new Error(`obsolete model-audio path returned: ${forbidden}`);
          }
          console.log(`Nexo ${pkg.version} · Codex OAuth dictation invariants OK`);
          NODE
      - name: Verify compact SOL plugin package can be assembled
        run: |
          rm -rf .solplugin-stage Nexo.solplugin
          mkdir -p .solplugin-stage
          cp package.json sol-plugin.json .solplugin-stage/
          cp -R dist .solplugin-stage/dist
          cd .solplugin-stage
          npm install --omit=dev --ignore-scripts --no-package-lock
          node ../scripts/prune-solplugin.mjs node_modules
          node --input-type=module -e "await Promise.all([import('baileys'), import('pg'), import('pino'), import('qrcode'), import('zod/v4'), import('@modelcontextprotocol/server'), import('@modelcontextprotocol/server/stdio')]); console.log('SOL plugin runtime imports OK')"
          find . -type f -printf '%P\n' | LC_ALL=C sort | zip -q ../Nexo.solplugin -@
          cd ..
          test -s Nexo.solplugin
          entries=$(zipinfo -1 Nexo.solplugin | wc -l | tr -d ' ')
          echo "Nexo.solplugin entries: $entries"
          if [ "$entries" -gt 2000 ]; then
            echo "Nexo.solplugin exceeds SOL's 2000-entry package limit"
            exit 1
          fi
          test "$(zipinfo -1 Nexo.solplugin | grep -c '^sol-plugin.json$')" -eq 1
