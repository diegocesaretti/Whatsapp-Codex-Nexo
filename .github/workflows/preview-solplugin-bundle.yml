name: Preview bundled SOL plugin

on:
  push:
    branches: [feat/sol-tool-registry]
    paths:
      - .github/workflows/preview-solplugin-bundle.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build compact Nexo.solplugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .solplugin-stage Nexo.solplugin
          mkdir -p .solplugin-stage/dist
          npx --yes esbuild@0.25.9 dist/index.js --bundle --platform=node --format=esm --target=node22 --packages=bundle --outfile=.solplugin-stage/dist/index.js
          cp sol-plugin.json .solplugin-stage/sol-plugin.json
          node -e 'const p=require("./package.json"); require("fs").writeFileSync(".solplugin-stage/package.json", JSON.stringify({name:"nexo-solplugin-runtime",version:p.version,private:true,type:"module"}, null, 2)+"\n")'
          node --check .solplugin-stage/dist/index.js
          cd .solplugin-stage
          zip -qry ../Nexo.solplugin .
          cd ..
          entries=$(unzip -Z1 Nexo.solplugin | wc -l | tr -d ' ')
          bytes=$(unzip -l Nexo.solplugin | awk 'END {print $1}')
          echo "Nexo.solplugin entries=$entries uncompressed_bytes=$bytes"
          test "$entries" -le 2000
          test "$bytes" -le $((128 * 1024 * 1024))
      - name: Publish corrected preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nexo-solplugin-preview-pr22 -y --cleanup-tag || true
          gh release create nexo-solplugin-preview-pr22 Nexo.solplugin --target "$GITHUB_SHA" --title "Nexo.solplugin 0.9.0 preview · PR 22" --notes "Compact bundled preview compatible with SOL package limits." --prerelease
