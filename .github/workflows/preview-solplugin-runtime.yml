name: Preview Nexo SOL plugin runtime

on:
  push:
    branches: [feat/sol-tool-registry]
    paths:
      - .github/workflows/preview-solplugin-runtime.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build and smoke-test compact plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .solplugin-stage Nexo.solplugin
          mkdir -p .solplugin-stage/dist
          npx --yes esbuild@0.25.9 dist/index.js --bundle --platform=node --format=esm --target=node24 --packages=bundle --banner:js='import { createRequire as __solCreateRequire } from "node:module"; const require = __solCreateRequire(import.meta.url);' --outfile=.solplugin-stage/dist/index.js
          cp sol-plugin.json .solplugin-stage/sol-plugin.json
          node -e 'const p=require("./package.json"); require("fs").writeFileSync(".solplugin-stage/package.json", JSON.stringify({name:"nexo-solplugin-runtime",version:p.version,private:true,type:"module"}, null, 2)+"\n")'
          node --check .solplugin-stage/dist/index.js
          smoke_dir="$(mktemp -d)"
          smoke_log="$(mktemp)"
          SOL_PLUGIN_TOKEN=smoke-token SOL_PLUGIN_API_URL=http://127.0.0.1:9 SOL_PLUGIN_DATA_DIR="$smoke_dir" NEXO_WHATSAPP_PORT=0 node .solplugin-stage/dist/index.js >"$smoke_log" 2>&1 &
          smoke_pid=$!
          smoke_ok=0
          for _ in $(seq 1 24); do
            if grep -q "WhatsApp Codex Nexo listening" "$smoke_log"; then smoke_ok=1; break; fi
            if ! kill -0 "$smoke_pid" 2>/dev/null; then cat "$smoke_log"; wait "$smoke_pid" || true; exit 1; fi
            sleep 0.25
          done
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" 2>/dev/null || true
          cat "$smoke_log"
          test "$smoke_ok" -eq 1
          ! grep -q 'Dynamic require of' "$smoke_log"
          rm -rf "$smoke_dir" "$smoke_log"
          cd .solplugin-stage && zip -qry ../Nexo.solplugin . && cd ..
          entries=$(unzip -Z1 Nexo.solplugin | wc -l | tr -d ' ')
          bytes=$(unzip -l Nexo.solplugin | awk 'END {print $1}')
          echo "Nexo.solplugin entries=$entries uncompressed_bytes=$bytes"
          test "$entries" -le 2000
          test "$bytes" -le $((128 * 1024 * 1024))
      - name: Publish corrected preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nexo-solplugin-preview-pr22 -y --cleanup-tag || true
          gh release create nexo-solplugin-preview-pr22 Nexo.solplugin --target "$GITHUB_SHA" --title "Nexo.solplugin 0.9.0 preview · PR 22" --notes "Runtime-smoked compact preview compatible with SOL." --prerelease
