name: Apply SOL ingestion patch

on:
  push:
    branches: [feat/sol-tool-registry]
    paths:
      - scripts/patch-sol-ingestion.mjs
      - .github/workflows/apply-sol-ingestion-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sol-tool-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-sol-ingestion.mjs
      - name: Commit precise source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/whatsapp-manager.ts
          git diff --cached --quiet && exit 0
          git commit -m "Honor Nexo source policy before SOL ingestion"
          git push origin HEAD:feat/sol-tool-registry
