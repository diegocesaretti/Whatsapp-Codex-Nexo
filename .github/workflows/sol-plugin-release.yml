name: SOL Plugin Release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - sol-plugin.json
      - .github/workflows/sol-plugin-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build Nexo.solplugin
        run: |
          rm -rf .solplugin-stage Nexo.solplugin
          mkdir -p .solplugin-stage
          cp package.json sol-plugin.json .solplugin-stage/
          cp -R dist .solplugin-stage/dist
          cd .solplugin-stage
          npm install --omit=dev --ignore-scripts --no-package-lock
          zip -qry ../Nexo.solplugin .
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: Nexo.solplugin
          path: Nexo.solplugin
      - name: Publish rolling SOL plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sol-plugin-latest -y --cleanup-tag || true
          gh release create sol-plugin-latest Nexo.solplugin --target "$GITHUB_SHA" --title "Nexo · WhatsApp SOL plugin" --notes "Rolling SOL plugin package built from main."
