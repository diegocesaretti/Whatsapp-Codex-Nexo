name: SOL Plugin Release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - sol-plugin.json
      - scripts/prune-solplugin.mjs
      - .github/workflows/sol-plugin-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build compact Nexo.solplugin
        run: |
          rm -rf .solplugin-stage Nexo.solplugin
          mkdir -p .solplugin-stage
          cp package.json sol-plugin.json .solplugin-stage/
          cp -R dist .solplugin-stage/dist
          cd .solplugin-stage
          npm install --omit=dev --ignore-scripts --no-package-lock
          node ../scripts/prune-solplugin.mjs node_modules
          node --input-type=module -e "await Promise.all([import('baileys'), import('pg'), import('pino'), import('qrcode'), import('zod/v4'), import('@modelcontextprotocol/server'), import('@modelcontextprotocol/server/stdio')]); console.log('SOL plugin runtime imports OK')"
          find . -type f -printf '%P\n' | LC_ALL=C sort | zip -q ../Nexo.solplugin -@
          cd ..
          entries=$(zipinfo -1 Nexo.solplugin | wc -l | tr -d ' ')
          echo "Nexo.solplugin entries: $entries"
          if [ "$entries" -gt 2000 ]; then
            echo "Nexo.solplugin exceeds SOL's 2000-entry package limit"
            exit 1
          fi
          test "$(zipinfo -1 Nexo.solplugin | grep -c '^sol-plugin.json$')" -eq 1
      - name: Publish rolling SOL plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sol-plugin-latest -y --cleanup-tag || true
          gh release create sol-plugin-latest Nexo.solplugin --target "$GITHUB_SHA" --title "Nexo · WhatsApp SOL plugin" --notes "Rolling compact SOL plugin package built from main."
      - name: Upload optional Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nexo.solplugin
          path: Nexo.solplugin
