name: Apply Nexo SOL plugin integration

on:
  push:
    branches: [feat/sol-input-plugin]
    paths:
      - scripts/apply-sol-input-plugin.mjs
      - .github/workflows/apply-sol-input-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sol-input-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-sol-input-plugin.mjs
      - name: Commit generated plugin integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Nexo with SOL Plugin Input API"
          git push origin HEAD:feat/sol-input-plugin
