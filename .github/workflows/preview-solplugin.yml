name: Preview SOL plugin

on:
  push:
    branches: [ feat/sol-tool-registry ]
    paths:
      - ".github/workflows/preview-solplugin.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build Nexo.solplugin
        run: |
          rm -rf .solplugin-stage Nexo.solplugin
          mkdir -p .solplugin-stage
          cp package.json sol-plugin.json .solplugin-stage/
          cp -R dist .solplugin-stage/dist
          cd .solplugin-stage
          npm install --omit=dev --ignore-scripts --no-package-lock
          zip -qry ../Nexo.solplugin .
          cd ..
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nexo-solplugin-preview-pr22 -y --cleanup-tag || true
          gh release create nexo-solplugin-preview-pr22 Nexo.solplugin --target "$GITHUB_SHA" --title "Nexo.solplugin 0.9.0 preview · PR 22" --notes "Preview build from feat/sol-tool-registry. Not main." --prerelease
